<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | HopeConnect</title>

    <link rel="stylesheet" href="CSS/style.css">

    <style>

        .signup-page {
            min-height: calc(100vh - 80px);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 70px 20px;

            background: #eee5df;
        }

        .signup-box {
            width: 100%;
            max-width: 480px;

            background: #f9f5f0;

            padding: 50px;

            border: 1px solid #dfd1c9;

            box-shadow: 0 25px 60px rgba(56, 39, 34, 0.10);
        }

        .signup-box h1 {
            font-family: "Playfair Display", serif;

            font-size: 46px;

            line-height: 1;

            color: #3b2528;

            margin-bottom: 12px;
        }

        .signup-subtitle {
            color: #756a65;

            font-size: 14px;

            margin-bottom: 35px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 0.5px;

            color: #554742;

            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;

            padding: 14px 15px;

            border: 1px solid #d5c7c0;

            background: #fffaf5;

            color: #332522;

            font-family: "DM Sans", sans-serif;

            font-size: 14px;

            outline: none;

            transition: border 0.25s ease,
                        box-shadow 0.25s ease;
        }

        .form-group input:focus {
            border-color: #a51c30;

            box-shadow: 0 0 0 3px rgba(165, 28, 48, 0.08);
        }

        .signup-button {
            width: 100%;

            border: none;

            padding: 15px;

            margin-top: 8px;

            background: #5b1824;

            color: white;

            font-family: "DM Sans", sans-serif;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition: all 0.25s ease;
        }

        .signup-button:hover {
            background: #741e2d;

            transform: translateY(-2px);
        }

        .login-text {
            text-align: center;

            margin-top: 25px;

            font-size: 13px;

            color: #756a65;
        }

        .login-text a {
            color: #a51c30;

            font-weight: 700;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        .form-note {
            margin-top: 18px;

            font-size: 11px;

            line-height: 1.6;

            color: #9a8b84;

            text-align: center;
        }

        @media (max-width: 550px) {

            .signup-box {
                padding: 35px 25px;
            }

            .signup-box h1 {
                font-size: 38px;
            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <header class="navbar">

        <a href="index.html" class="logo">
            HopeConnect
        </a>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="index.html#about">
                About
            </a>

            <a href="campaigns.html">
                Campaigns
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>



    <!-- SIGNUP PAGE -->

    <main class="signup-page">

        <div class="signup-box">

            <div class="section-label">
                JOIN HOPECONNECT
            </div>

            <h1>
                Create your account.
            </h1>

            <p class="signup-subtitle">
                Become a donor and start supporting causes
                that matter to you.
            </p>



            <!-- SIGNUP FORM -->

            <form id="signupForm">


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        FULL NAME
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>



                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        EMAIL ADDRESS
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        PASSWORD
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        CONFIRM PASSWORD
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>



                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="signup-button"
                >
                    Create Account
                </button>

            </form>



            <!-- LOGIN LINK -->

            <p class="login-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>



            <p class="form-note">

                Your account information will be stored
                in your browser using Local Storage.

            </p>

        </div>

    </main>



    <!-- SIGNUP + LOCAL STORAGE -->

    <script>

        document
            .getElementById("signupForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                // Get form values

                const name =
                    document.getElementById("name").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;



                // Check password

                if (password !== confirmPassword) {

                    alert("Passwords do not match!");

                    return;

                }



                // Get existing users

                let users =
                    JSON.parse(
                        localStorage.getItem("users")
                    ) || [];



                // Check existing email

                const existingUser =
                    users.find(function(user) {

                        return user.email === email;

                    });



                if (existingUser) {

                    alert(
                        "An account with this email already exists!"
                    );

                    return;

                }



                // Create new user

                const newUser = {

                    name: name,

                    email: email,

                    password: password

                };



                // Add user to array

                users.push(newUser);



                // Save in Local Storage

                localStorage.setItem(
                    "users",
                    JSON.stringify(users)
                );



                // Success message

                alert(
                    "Account created successfully!"
                );



                // Redirect to login

                window.location.href =
                    "login.html";

            });

    </script>



    <!-- CURSOR HEART -->

    <script src="js/cursor.js"></script>


</body>

</html>
